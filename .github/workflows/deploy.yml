name: Déploiement WordPress (Hostinger)

# develop -> staging (dev)   ·   release-x.y.z -> production (prd)
# Convention de version : <version_theme>.<version_plugin>
on:
  push:
    branches:
      - develop
      - 'release-**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP
        run: |
          set -e
          find wordpress -name '*.php' -print0 | while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || { echo "ERREUR de syntaxe : $f"; exit 1; }
          done
          echo "PHP OK"

      - name: Équilibre des accolades CSS
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          bad = []
          for p in pathlib.Path('wordpress').rglob('*.css'):
              s = p.read_text(encoding='utf-8', errors='ignore')
              if s.count('{') != s.count('}'):
                  bad.append(str(p))
          if bad:
              print('CSS déséquilibré :', bad); sys.exit(1)
          print('CSS OK')
          PY

      - name: Syntaxe JS
        run: |
          if [ -d node_modules ]; then exit 0; fi
          for f in $(find wordpress -name '*.js' -not -path '*/node_modules/*'); do
            node --check "$f" || exit 1
          done
          echo "JS OK"

  deploiement:
    name: rsync vers Hostinger
    needs: qualite
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'develop' && 'dev' || 'prd' }}
    steps:
      - uses: actions/checkout@v5

      - name: Version du thème
        id: v
        run: |
          THEME_V=$(grep -m1 '^Version:' wordpress/tuc-theme/style.css | sed 's/Version:[[:space:]]*//')
          echo "theme=$THEME_V" >> "$GITHUB_OUTPUT"
          echo "Version du thème : $THEME_V"

      - name: Contrôle des secrets
        env:
          S_HOST: ${{ secrets.SSH_HOST }}
          S_USER: ${{ secrets.SSH_USERNAME || secrets.SSH_USER }}
          S_ROOT: ${{ secrets.WP_ROOT }}
          S_URL:  ${{ secrets.SITE_URL }}
          S_KEY:  ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          manquant=0
          for n in S_HOST S_USER S_ROOT S_URL S_KEY; do
            if [ -z "${!n}" ]; then
              echo "::error::Secret manquant dans l'environnement (dev|prd) : $n"
              manquant=1
            fi
          done
          if [ "$manquant" != "0" ]; then
            echo "→ Settings > Environments > dev (ou prd) > Add secret"
            echo "  S_HOST=SSH_HOST  S_USER=SSH_USER  S_ROOT=WP_ROOT  S_URL=SITE_URL  S_KEY=SSH_PRIVATE_KEY"
            exit 1
          fi
          echo "Tous les secrets sont présents."

      - name: Préparer la clé SSH
        env:
          PORT: ${{ vars.SSH_PORT || '65002' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "::error::SSH_PRIVATE_KEY n'est pas une clé privée valide (OpenSSH ou RSA attendue)"; exit 1; }
          ssh-keyscan -p "$PORT" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>&1 | tail -1
          echo "Empreinte de la clé publique (à autoriser sur Hostinger) :"
          ssh-keygen -y -f ~/.ssh/id_deploy | ssh-keygen -lf -

      - name: Envoyer le thème
        env:
          PORT: ${{ vars.SSH_PORT || '65002' }}
        run: |
          rsync -az --delete --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_deploy -p ${{ vars.SSH_PORT || 65002 }} -o StrictHostKeyChecking=accept-new" \
            wordpress/tuc-theme/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.WP_ROOT }}/wp-content/themes/tuc-theme/"

      - name: Envoyer le plugin (si présent)
        if: hashFiles('wordpress/tuc-market-core/**') != ''
        run: |
          rsync -az --delete --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_deploy -p ${{ vars.SSH_PORT || 65002 }} -o StrictHostKeyChecking=accept-new" \
            wordpress/tuc-market-core/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.WP_ROOT }}/wp-content/plugins/tuc-market-core/"

      - name: Vider le cache + vérifier
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ vars.SSH_PORT || 65002 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ secrets.WP_ROOT }} && \
             (wp cache flush --allow-root || true) && \
             (wp rewrite flush --allow-root || true) && \
             (wp litespeed-purge all --allow-root || php -r 'echo \"cache: n/a\n\";')"

      - name: Fumigène (health check)
        run: |
          URL="${{ secrets.SITE_URL }}/wp-json/tuc/v1/sante"
          echo "GET $URL"
          for i in 1 2 3 4 5; do
            BODY=$(curl -fsS --max-time 20 "$URL" 2>/dev/null) && break
            echo "tentative $i échouée, on réessaie…"
            sleep 8
          done
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true' || { echo "❌ /sante ne répond pas"; exit 1; }
          echo "✅ déploiement vert — version ${{ steps.v.outputs.theme }}"
