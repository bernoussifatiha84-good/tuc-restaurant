name: Déploiement WordPress (3 environnements)

# La cible est déterminée par le type et le nom de la référence :
#   branche develop       -> dev
#   tag pre-release-x.y.z -> uat
#   tag release-x.y.z     -> prd
on:
  push:
    branches: [develop]
    tags:
      - 'pre-release-*'
      - 'release-*'
  workflow_dispatch:
    inputs:
      operation:
        description: Opération à exécuter
        type: choice
        options:
          - deploy
          - inventory-woocommerce
        default: deploy
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # Jamais d'annulation en cours de route : un rsync --delete interrompu
  # laisserait le site a moitie deploye.
  cancel-in-progress: false

jobs:
  qualite:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null || { echo "::error file=$f::Erreur de syntaxe PHP"; exit 1; }
          done < <(find wordpress -name '*.php' -print0)
          echo "PHP OK"

      - name: Équilibre des accolades CSS
        run: |
          python3 - <<'PY'
          import pathlib, sys
          bad = []
          for path in pathlib.Path('wordpress').rglob('*.css'):
              text = path.read_text(encoding='utf-8', errors='ignore')
              if text.count('{') != text.count('}'):
                  bad.append(str(path))
          if bad:
              print('CSS déséquilibré :', bad)
              sys.exit(1)
          print('CSS OK')
          PY

      - name: Syntaxe JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done \
            < <(find wordpress -name '*.js' -not -path '*/node_modules/*' -print0)
          echo "JS OK"

      - name: Vérifier les fichiers WordPress requis
        run: |
          test -f wordpress/tuc-theme/style.css
          test -f wordpress/tuc-theme/index.php
          test -f wordpress/tuc-market-core/tuc-market-core.php
          grep -q '^Version:' wordpress/tuc-theme/style.css
          grep -q "const TUC_CORE_VERSION" wordpress/tuc-market-core/tuc-market-core.php
          echo "Thème et plugin présents."

      - name: Cohérence des versions (en-tête, constante, tag)
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          # Le health check lit la constante, `wp plugin get` lit l'en-tête :
          # un désaccord publie deux versions différentes pour un même déploiement.
          if output="$(python3 tests/version-contract.py 2>&1)"; then
            printf '%s\n' "$output"
          else
            printf '%s\n' "$output"
            excerpt="$(printf '%s\n' "$output" | tail -c 1200 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Incohérence de version::$excerpt"
            exit 1
          fi

      - name: Auto-test du garde-fou de version
        shell: bash
        run: |
          set -euo pipefail
          # Prouve à chaque exécution que le garde-fou rejette bien le tag fautif
          # pre-release-0.8.9 (en-tête 0.8.8 / constante 0.8.9).
          python3 tests/version-contract.py --self-test

  cible:
    name: Résoudre la cible
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.resolve.outputs.env }}
      url: ${{ steps.resolve.outputs.url }}
      root: ${{ steps.resolve.outputs.root }}
    steps:
      - name: Référence vers environnement
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation }}
          URL_DEV: ${{ vars.URL_DEV }}
          ROOT_DEV: ${{ vars.ROOT_DEV }}
          URL_UAT: ${{ vars.URL_UAT }}
          ROOT_UAT: ${{ vars.ROOT_UAT }}
          URL_PRD: ${{ vars.URL_PRD }}
          ROOT_PRD: ${{ vars.ROOT_PRD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch && "$OPERATION" == inventory-woocommerce ]]; then
            ENV_NAME=uat; URL="$URL_UAT"; ROOT="$ROOT_UAT"
          elif [[ "$REF_TYPE" == branch && "$REF_NAME" == develop ]]; then
            ENV_NAME=dev; URL="$URL_DEV"; ROOT="$ROOT_DEV"
          elif [[ "$REF_TYPE" == tag && "$REF_NAME" == pre-release-* ]]; then
            ENV_NAME=uat; URL="$URL_UAT"; ROOT="$ROOT_UAT"
          elif [[ "$REF_TYPE" == tag && "$REF_NAME" == release-* ]]; then
            ENV_NAME=prd; URL="$URL_PRD"; ROOT="$ROOT_PRD"
          else
            echo "::error::Référence non autorisée : $REF_TYPE '$REF_NAME'."
            echo "Attendu : branche develop, tag pre-release-x.y.z ou tag release-x.y.z."
            exit 1
          fi

          if [[ -z "$URL" || -z "$ROOT" ]]; then
            if [[ "$ENV_NAME" == prd ]]; then
              echo "::error::La cible prd n'est pas encore configurée (URL_PRD/ROOT_PRD)."
            else
              echo "::error::Variables d'environnement manquantes pour '$ENV_NAME'."
            fi
            exit 1
          fi

          printf 'env=%s\nurl=%s\nroot=%s\n' "$ENV_NAME" "$URL" "$ROOT" >> "$GITHUB_OUTPUT"
          echo "Référence '$REF_NAME' → environnement '$ENV_NAME'."

  deploiement:
    name: Déploiement vers ${{ needs.cible.outputs.env }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation != 'inventory-woocommerce' }}
    needs: [qualite, cible]
    runs-on: ubuntu-latest
    environment: ${{ needs.cible.outputs.env }}
    steps:
      - uses: actions/checkout@v5

      - name: Lire les versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          THEME_VERSION=$(sed -n 's/^Version:[[:space:]]*//p' wordpress/tuc-theme/style.css | head -n 1)
          PLUGIN_VERSION=$(sed -n "s/.*const TUC_CORE_VERSION = '\([^']*\)'.*/\1/p" \
            wordpress/tuc-market-core/tuc-market-core.php | head -n 1)
          PLUGIN_HEADER=$(sed -n 's/^ \* Version:[[:space:]]*//p' \
            wordpress/tuc-market-core/tuc-market-core.php | head -n 1)
          test -n "$THEME_VERSION" && test -n "$PLUGIN_VERSION" && test -n "$PLUGIN_HEADER"
          # Dernier verrou avant rsync : ce qui sera publié doit porter une seule
          # version, et un tag de déploiement doit porter la version qu'il annonce.
          if [ "$PLUGIN_HEADER" != "$PLUGIN_VERSION" ]; then
            echo "::error title=Incohérence de version::en-tête $PLUGIN_HEADER != constante $PLUGIN_VERSION ; déploiement annulé avant toute écriture."
            exit 1
          fi
          case "$GITHUB_REF_NAME" in
            pre-release-*|release-*)
              TAG_VERSION=$(printf '%s' "$GITHUB_REF_NAME" | sed -E 's/^(pre-release|release)-([0-9]+\.[0-9]+\.[0-9]+).*$/\2/')
              if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
                echo "::error title=Tag et version divergents::$GITHUB_REF_NAME annonce $TAG_VERSION mais le plugin porte $PLUGIN_VERSION ; déploiement annulé."
                exit 1
              fi
              ;;
          esac
          printf 'theme=%s\nplugin=%s\n' "$THEME_VERSION" "$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "Thème $THEME_VERSION · plugin $PLUGIN_VERSION (en-tête et constante alignés)"

      - name: Vérifier les secrets de déploiement
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME || secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_ROOT: ${{ needs.cible.outputs.root }}
          SITE_URL: ${{ needs.cible.outputs.url }}
          ENV_NAME: ${{ needs.cible.outputs.env }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_ROOT SITE_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configuration manquante : $name (environnement '$ENV_NAME')."
              exit 1
            fi
          done
          echo "Configuration présente pour '$ENV_NAME'."

      - name: Préparer la connexion SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '65002' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          ssh-keygen -y -f "$HOME/.ssh/id_deploy" >/dev/null
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null

      - name: Vérifier que la cible UAT est bien le site provisoire
        if: needs.cible.outputs.env == 'uat'
        env:
          SSH_PORT: ${{ vars.SSH_PORT || '65002' }}
          SSH_USER: ${{ secrets.SSH_USERNAME || secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_ROOT: ${{ needs.cible.outputs.root }}
          SITE_URL: ${{ needs.cible.outputs.url }}
          URL_PRD: ${{ vars.URL_PRD }}
          ROOT_PRD: ${{ vars.ROOT_PRD }}
        shell: bash
        run: |
          set -euo pipefail
          normalize_path() { printf '%s' "$1" | sed 's:/*$::'; }
          normalize_url() { printf '%s' "$1" | sed 's:/*$::'; }
          if [[ -n "$URL_PRD" && "$(normalize_url "$SITE_URL")" == "$(normalize_url "$URL_PRD")" ]]; then
            echo "::error::URL_UAT pointe vers la même URL que URL_PRD; aucun fichier ne sera envoyé."
            exit 1
          fi
          if [[ -n "$ROOT_PRD" && "$(normalize_path "$SSH_ROOT")" == "$(normalize_path "$ROOT_PRD")" ]]; then
            echo "::error::ROOT_UAT pointe vers la même racine que ROOT_PRD; aucun fichier ne sera envoyé."
            exit 1
          fi
          printf -v remote_root '%q' "$SSH_ROOT"
          remote_url="$(ssh -i "$HOME/.ssh/id_deploy" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "wp option get siteurl --path=$remote_root")"
          if [[ "$(normalize_url "$remote_url")" != "$(normalize_url "$SITE_URL")" ]]; then
            echo "::error::L'URL WordPress lue sur ROOT_UAT ne correspond pas à URL_UAT; déploiement annulé."
            exit 1
          fi
          echo "Cible WordPress UAT vérifiée : URL et racine distinctes de la production."

      - name: Sauvegarder les répertoires avant rsync --delete
        env:
          SSH_PORT: ${{ vars.SSH_PORT || '65002' }}
          SSH_USER: ${{ secrets.SSH_USERNAME || secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_ROOT: ${{ needs.cible.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          printf -v remote_root '%q' "$SSH_ROOT"
          ssh -i "$HOME/.ssh/id_deploy" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "bash -s -- $remote_root" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          backup="wp-content/upgrade/tuc-predeploy-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$backup"

          # Chaque archive est verifiee APRES creation. Un `if` autour du tar
          # laissait le step reussir avec 0 fichier produit : c'est precisement
          # le faux vert que ce garde-fou doit rendre impossible.
          faits=0
          ranger() { # $1 = dossier source, $2 = nom d'archive
            if [ ! -d "$1" ]; then
              echo "  $1 absent : rien a sauvegarder a cet emplacement."
              return 0
            fi
            tar -czf "$backup/$2" -C "$(dirname "$1")" "$(basename "$1")"
            if [ ! -s "$backup/$2" ]; then
              echo "::error::$2 absent ou vide alors que $1 existe. Arret avant toute ecriture."
              exit 1
            fi
            entrees=$(tar -tzf "$backup/$2" | wc -l)
            if [ "$entrees" -lt 2 ]; then
              echo "::error::$2 ne contient que $entrees entree(s) : $1 semble vide. Arret avant toute ecriture."
              exit 1
            fi
            echo "  $2 : $entrees entrees, $(du -h "$backup/$2" | cut -f1)"
            faits=$((faits + 1))
          }
          ranger wp-content/themes/tuc-theme theme.tgz
          ranger wp-content/plugins/tuc-market-core plugin.tgz

          if [ "$faits" -eq 0 ]; then
            echo "::warning::Aucune archive produite (premier deploiement ?). Rien a proteger du rsync --delete."
          else
            echo "Sauvegarde verifiee : $faits archive(s) non vides dans $backup"
          fi
          REMOTE

      - name: Envoyer le thème
        env:
          SSH_PORT: ${{ vars.SSH_PORT || '65002' }}
          SSH_USER: ${{ secrets.SSH_USERNAME || secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_ROOT: ${{ needs.cible.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete --no-perms --no-owner --no-group \
            -e "ssh -i $HOME/.ssh/id_deploy -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            wordpress/tuc-theme/ \
            "$SSH_USER@$SSH_HOST:$SSH_ROOT/wp-content/themes/tuc-theme/"

      - name: Envoyer le plugin métier
        env:
          SSH_PORT: ${{ vars.SSH_PORT || '65002' }}
          SSH_USER: ${{ secrets.SSH_USERNAME || secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_ROOT: ${{ needs.cible.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete --no-perms --no-owner --no-group \
            -e "ssh -i $HOME/.ssh/id_deploy -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            wordpress/tuc-market-core/ \
            "$SSH_USER@$SSH_HOST:$SSH_ROOT/wp-content/plugins/tuc-market-core/"

      - name: Activer le plugin et le thème, puis purger les caches
        env:
          SSH_PORT: ${{ vars.SSH_PORT || '65002' }}
          SSH_USER: ${{ secrets.SSH_USERNAME || secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_ROOT: ${{ needs.cible.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_deploy" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd '$SSH_ROOT' && set -e && \
             wp plugin activate tuc-market-core && \
             wp theme activate tuc-theme && \
             wp option update permalink_structure '/%postname%/' && \
             wp cache flush && \
             wp rewrite flush --hard && \
             (wp litespeed-purge all || true)"

      - name: Vérifier la santé et les versions déployées
        env:
          SITE_URL: ${{ needs.cible.outputs.url }}
          ENV_NAME: ${{ needs.cible.outputs.env }}
          THEME_VERSION: ${{ steps.versions.outputs.theme }}
          PLUGIN_VERSION: ${{ steps.versions.outputs.plugin }}
        shell: bash
        run: |
          set -euo pipefail
          BODY=""
          for attempt in 1 2 3 4 5; do
            BODY=$(curl -fsS --max-time 20 "$SITE_URL/wp-json/tuc/v1/sante" 2>/dev/null) && break
            BODY=$(curl -fsS --max-time 20 "$SITE_URL/?rest_route=/tuc/v1/sante" 2>/dev/null) && break
            echo "Tentative $attempt/5 échouée, nouvelle tentative…"
            sleep 8
          done

          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true' || {
            echo "::error::Le contrôle de santé a échoué pour '$ENV_NAME'."
            exit 1
          }
          echo "$BODY" | grep -q "\"plugin\":\"$PLUGIN_VERSION\"" || {
            echo "::error::La version du plugin déployée ne correspond pas à $PLUGIN_VERSION."
            exit 1
          }
          echo "$BODY" | grep -q "\"theme_ver\":\"$THEME_VERSION\"" || {
            echo "::error::La version du thème déployée ne correspond pas à $THEME_VERSION."
            exit 1
          }

          {
            echo "### ✅ $ENV_NAME déployé"
            echo ""
            echo "| Élément | Valeur |"
            echo "|---|---|"
            echo "| Environnement | $ENV_NAME |"
            echo "| Référence | $GITHUB_REF_NAME |"
            echo "| Thème | $THEME_VERSION |"
            echo "| Plugin | $PLUGIN_VERSION |"
          } >> "$GITHUB_STEP_SUMMARY"

  inventaire_woocommerce:
    name: Inventaire WooCommerce (lecture seule)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'inventory-woocommerce' }}
    needs: [cible]
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v5

      - name: Valider le périmètre UAT et les secrets SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME || secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_ROOT: ${{ needs.cible.outputs.root }}
          SITE_URL: ${{ needs.cible.outputs.url }}
          URL_PRD: ${{ vars.URL_PRD }}
          ROOT_PRD: ${{ vars.ROOT_PRD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_ROOT SITE_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configuration UAT manquante : $name. Aucun accès distant effectué."
              exit 1
            fi
          done
          trim_slashes() { printf '%s' "$1" | sed 's:/*$::'; }
          if [[ -n "$URL_PRD" && "$(trim_slashes "$SITE_URL")" == "$(trim_slashes "$URL_PRD")" ]]; then
            echo "::error::URL_UAT égale à URL_PRD; inventaire annulé."
            exit 1
          fi
          if [[ -n "$ROOT_PRD" && "$(trim_slashes "$SSH_ROOT")" == "$(trim_slashes "$ROOT_PRD")" ]]; then
            echo "::error::ROOT_UAT égale à ROOT_PRD; inventaire annulé."
            exit 1
          fi

      - name: Linter le script d’inventaire
        run: php -l tools/woocommerce-inventory.php

      - name: Préparer la connexion SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '65002' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          ssh-keygen -y -f "$HOME/.ssh/id_deploy" >/dev/null
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null

      - name: Vérifier l’URL du WordPress UAT
        env:
          SSH_PORT: ${{ vars.SSH_PORT || '65002' }}
          SSH_USER: ${{ secrets.SSH_USERNAME || secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_ROOT: ${{ needs.cible.outputs.root }}
          SITE_URL: ${{ needs.cible.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          printf -v remote_root '%q' "$SSH_ROOT"
          remote_url="$(ssh -i "$HOME/.ssh/id_deploy" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "wp option get siteurl --path=$remote_root")"
          if [[ "$(printf '%s' "$remote_url" | sed 's:/*$::')" != "$(printf '%s' "$SITE_URL" | sed 's:/*$::')" ]]; then
            echo "::error::L’URL WordPress ne correspond pas à URL_UAT; inventaire annulé."
            exit 1
          fi
          echo "Cible UAT vérifiée; inventaire agrégé en lecture seule."

      - name: Relever les extensions et les volumes de données (sans données personnelles)
        env:
          SSH_PORT: ${{ vars.SSH_PORT || '65002' }}
          SSH_USER: ${{ secrets.SSH_USERNAME || secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_ROOT: ${{ needs.cible.outputs.root }}
          REMOTE_AUDIT: /tmp/tuc-woocommerce-inventory-${{ github.run_id }}.php
        shell: bash
        run: |
          set -euo pipefail
          printf -v remote_root '%q' "$SSH_ROOT"
          scp -i "$HOME/.ssh/id_deploy" -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            tools/woocommerce-inventory.php "$SSH_USER@$SSH_HOST:$REMOTE_AUDIT"
          report_file="$RUNNER_TEMP/woocommerce-inventory.json"
          diagnostic_file="$RUNNER_TEMP/woocommerce-inventory.err"
          remote_status=0
          if ! ssh -i "$HOME/.ssh/id_deploy" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "test -r '$REMOTE_AUDIT'"; then
            remote_status=1
            echo "::error::Le fichier temporaire d’inventaire n’est pas lisible sur l’hôte UAT."
          elif ssh -i "$HOME/.ssh/id_deploy" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "wp --path=$remote_root eval-file '$REMOTE_AUDIT'" \
            >"$report_file" 2>"$diagnostic_file"; then
            cat "$report_file"
            cat "$report_file" >> "$GITHUB_STEP_SUMMARY"
            compact_report="$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), separators=(",",":"), ensure_ascii=False))' "$report_file")"
            compact_report="${compact_report//%/%25}"
            compact_report="${compact_report//$'\r'/%0D}"
            compact_report="${compact_report//$'\n'/%0A}"
            if (( ${#compact_report} < 60000 )); then
              echo "::notice title=Inventaire agrégé WooCommerce UAT::$compact_report"
            else
              echo "::notice title=Inventaire WooCommerce UAT::Rapport complet disponible dans le résumé du job."
            fi
          else
            remote_status=$?
            diagnostic="$(cat "$report_file" "$diagnostic_file" 2>/dev/null || true)"
            if grep -Eqi 'could not open input file|no such file or directory' <<< "$diagnostic"; then
              reason="WP-CLI ne peut pas ouvrir le script temporaire."
            elif grep -Eqi 'error establishing a database connection' <<< "$diagnostic"; then
              reason="WordPress n’a pas pu établir sa connexion à la base de données."
            elif grep -Eqi 'call to undefined function|class .* not found' <<< "$diagnostic"; then
              reason="Une fonction ou classe attendue est absente sur l’UAT."
            elif grep -Eqi 'allowed memory size' <<< "$diagnostic"; then
              reason="La limite mémoire PHP a été atteinte."
            elif grep -Eqi 'fatal error|parse error|uncaught' <<< "$diagnostic"; then
              reason="Une erreur d’exécution PHP est survenue dans l’inventaire."
            else
              reason="WP-CLI a retourné une erreur non classifiée."
            fi
            echo "::error::$reason Aucun détail brut affiché."
          fi
          ssh -i "$HOME/.ssh/id_deploy" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "rm -f '$REMOTE_AUDIT'" || true
          if [[ "$remote_status" -ne 0 ]]; then
            exit "$remote_status"
          fi
