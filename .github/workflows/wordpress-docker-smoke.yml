name: WordPress Docker smoke test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wp-docker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wordpress-docker:
    name: Installer et vérifier WordPress/TUC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Créer des identifiants éphémères pour la base locale au runner
        shell: bash
        run: |
          set -euo pipefail
          DB_PASSWORD="$(openssl rand -hex 24)"
          DB_ROOT_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$DB_ROOT_PASSWORD"
          {
            printf 'TUC_WP_IMAGE=wordpress:php8.2-apache\n'
            printf 'TUC_WP_CLI_IMAGE=wordpress:cli-php8.2\n'
            printf 'TUC_DB_IMAGE=mariadb:10.11\n'
            printf 'TUC_WP_PORT=8080\n'
            printf 'TUC_DB_NAME=tuc_smoke\n'
            printf 'TUC_DB_USER=tuc_smoke\n'
            printf 'TUC_DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'TUC_DB_ROOT_PASSWORD=%s\n' "$DB_ROOT_PASSWORD"
          } > .env

      - name: Valider la configuration Compose
        run: docker compose config --quiet

      - name: Démarrer WordPress et MariaDB
        run: docker compose up --detach --wait --wait-timeout 180 wordpress

      - name: Vérifier WP-CLI
        run: docker compose run --rm --entrypoint wp wpcli cli info

      - name: Installer WordPress avec WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          WP_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$WP_ADMIN_PASSWORD"
          docker compose run --rm --entrypoint wp wpcli core install \
            --url='http://127.0.0.1:8080' \
            --title='TUC WordPress Docker smoke test' \
            --admin_user='tuc-smoke-admin' \
            --admin_password="$WP_ADMIN_PASSWORD" \
            --admin_email='tuc-smoke@example.invalid' \
            --skip-email

      - name: Activer le plugin et le thème TUC
        run: |
          set -euo pipefail
          docker compose run --rm --entrypoint wp wpcli plugin activate tuc-market-core
          docker compose run --rm --entrypoint wp wpcli theme activate tuc-theme
          docker compose run --rm --entrypoint wp wpcli plugin is-active tuc-market-core
          docker compose run --rm --entrypoint wp wpcli theme is-active tuc-theme
          docker compose run --rm --entrypoint wp wpcli core version

      - name: Vérifier désactivation et réactivation du plugin
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm --entrypoint wp wpcli plugin deactivate tuc-market-core
          inactive_plugins="$(docker compose run --rm --entrypoint wp wpcli plugin list --status=inactive --field=name)"
          printf '%s\n' "$inactive_plugins" | grep -Fx 'tuc-market-core'
          docker compose run --rm --entrypoint wp wpcli plugin activate tuc-market-core
          docker compose run --rm --entrypoint wp wpcli plugin is-active tuc-market-core

      - name: Vérifier la syntaxe du plugin, du thème et des tests PHP
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm --entrypoint sh wpcli -lc '
            find /var/www/html/wp-content/plugins/tuc-market-core \
              /var/www/html/wp-content/themes/tuc-theme \
              /opt/tuc-tests \
              -type f -name "*.php" -print0 | xargs -0 -n1 php -l
          '

      - name: Exécuter les régressions WordPress/TUC
        shell: bash
        run: |
          set -uo pipefail
          # GitHub’s bash shell enables errexit; disable it while capturing the
          # expected non-zero status so the diagnostic output below can run.
          set +e
          regression_output="$(docker compose run --rm --entrypoint wp wpcli eval-file /opt/tuc-tests/wp-docker-regression.php 2>&1)"
          regression_status=$?
          set -e
          printf '%s\n' "$regression_output"
          if [ "$regression_status" -ne 0 ]; then
            echo "::error title=Regression runner failed::WP-CLI exited with status $regression_status"
            failure_excerpt="$(printf '%s\n' "$regression_output" | grep -E 'ASSERTION_FAILURE:|PHP_FATAL_DEBUG:|PHP Fatal error|Uncaught|ÉCHEC :' | tail -n 5 | tr '\n' ' ' | cut -c1-1200 | sed 's/%/%25/g; s/\r/%0D/g')"
            if [ -z "$failure_excerpt" ]; then
              failure_excerpt="$(printf '%s\n' "$regression_output" | tr '\n' ' ' | tail -c 1200 | sed 's/%/%25/g; s/\r/%0D/g')"
            fi
            echo "::error title=WP-CLI failure detail::$failure_excerpt"
            exit "$regression_status"
          fi

      - name: Vérifier HTTP, REST et la version PHP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-connrefused \
            http://127.0.0.1:8080/ --output /dev/null
          health="$(curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-connrefused \
            http://127.0.0.1:8080/wp-json/tuc/v1/sante)"
          printf '%s' "$health" | python3 -c '
          import json, sys
          result = json.load(sys.stdin)
          assert result.get("ok") is True, result
          assert all(result.get("modules", {}).get(key) is True for key in ("cpt_resto", "cpt_menu", "cpt_commande")), result
          print("REST health OK · plugin", result.get("plugin"), "· WordPress", result.get("wp"), "· PHP", result.get("php"))
          '
          docker compose exec --no-TTY wordpress php -v

      - name: Échouer sur une erreur PHP fatale du site
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec --no-TTY wordpress sh -lc '
            if [ -f /var/www/html/wp-content/debug.log ] &&
              grep -E "PHP Fatal error|Uncaught Error" /var/www/html/wp-content/debug.log; then
              exit 1
            fi
          '

      - name: Journaux Docker et erreurs PHP en cas d’échec
        if: failure()
        shell: bash
        run: |
          docker compose logs --no-color || true
          if docker compose exec --no-TTY wordpress sh -lc 'test -f /var/www/html/wp-content/debug.log'; then
            debug_log="$(docker compose exec --no-TTY wordpress sh -lc 'tail -n 100 /var/www/html/wp-content/debug.log' || true)"
            printf '%s\n' "$debug_log"
            {
              echo '### WordPress debug.log'
              echo '```text'
              printf '%s\n' "$debug_log" | tail -n 100
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            fatal_line="$(printf '%s\n' "$debug_log" | grep -E 'PHP Fatal error|Uncaught|TypeError|Error:' | tail -n 1 | tr '\n' ' ' | cut -c1-900)"
            if [ -n "$fatal_line" ]; then
              echo "::error title=WordPress PHP error::$fatal_line"
            fi
          fi
          if docker compose exec --no-TTY wordpress sh -lc 'test -f /var/www/html/wp-content/tuc-regression-progress.log'; then
            progress_log="$(docker compose exec --no-TTY wordpress sh -lc 'cat /var/www/html/wp-content/tuc-regression-progress.log' || true)"
            printf '%s\n' "$progress_log"
            {
              echo '### WordPress regression progress'
              echo '```text'
              printf '%s\n' "$progress_log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            last_progress="$(printf '%s\n' "$progress_log" | tail -n 1 | tr '\n' ' ' | cut -c1-900)"
            if [ -n "$last_progress" ]; then
              echo "::error title=Last WordPress regression stage::$last_progress"
            fi
          fi

      - name: Nettoyer les conteneurs, volumes et identifiants éphémères
        if: always()
        run: |
          docker compose down --volumes --remove-orphans || true
          rm -f .env
