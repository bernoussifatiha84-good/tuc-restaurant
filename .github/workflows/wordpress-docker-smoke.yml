name: WordPress Docker smoke test

on:
  # Filet avant merge : toute PR visant main est verifiee.
  pull_request:
    branches: [main]
  # Filet apres merge : sans ce declencheur, le tronc n'est plus couvert des
  # qu'une PR est fusionnee (une PR ne teste que ses propres changements).
  # develop y figure parce que c'est la branche QUI DEPLOIE : la verifier
  # seulement apres passage dans main reviendrait a tester ce qui est deja
  # parti sur le serveur. (Les jobs Windows/NVDA restent filtres sur main.)
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wp-docker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wordpress-docker:
    name: Installer et vérifier WordPress/TUC
    runs-on: ubuntu-24.04
    # 15 minutes ne suffisaient plus des que Chromium doit etre re-telecharge :
    # au run 43060893203 (69f7dc1 -> 350abea) le job a ete ANNULE a 16:57,
    # 15 min apres son depart, l'etape 24 (Installation Chromium) en ayant
    # consomme 13,5 — les etapes 27 a 41 n'ont donc pas pu s'executer. Le budget
    # est porte a 30 min, et l'etape Chromium est bornee ci-dessous pour ne plus
    # dependre de ce budget.
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Récupérer develop pour le contrôle de lignée
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin develop:refs/remotes/origin/develop

      - name: Vérifier que la branche ne perd pas develop
        shell: bash
        env:
          TUC_REQUIRE_ANCESTRY: '1'
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check --quiet pyyaml
          if output="$(python3 tests/lineage-contract.py 2>&1)"; then
            printf '%s\n' "$output"
          else
            printf '%s\n' "$output"
            excerpt="$(printf '%s\n' "$output" | tail -c 1500 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Lignée develop perdue::$excerpt"
            exit 1
          fi
          summary="$(printf '%s\n' "$output" | grep -E "ancêtre de HEAD|échec\(s\)" | tr '\n' ' ' | sed 's/%/%25/g')"
          echo "::notice title=Contrôle de lignée develop::$summary"


      - name: Vérifier la cohérence des versions
        shell: bash
        run: |
          set -euo pipefail
          if output="$(python3 tests/version-contract.py 2>&1)"; then
            printf '%s\n' "$output"
          else
            printf '%s\n' "$output"
            excerpt="$(printf '%s\n' "$output" | tail -c 1200 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Incohérence de version::$excerpt"
            exit 1
          fi
          python3 tests/version-contract.py --self-test
          summary="$(printf '%s\n' "$output" | grep -E 'En-tête plugin|Constante|Thème' | tr '\n' ' ' | sed 's/%/%25/g')"
          echo "::notice title=Cohérence des versions::$summary"

      - name: Vérifier l'horloge serveur (vrai epoch UTC)
        shell: bash
        run: |
          set -euo pipefail
          # 'age' marchait par accident (current_time + strtotime derivent tous
          # deux de gmt_offset). Cette garde refuse le retour de la paire
          # accidentelle, y compris quand gmt_offset vaut 0 — c'est-a-dire
          # toujours, sur la CI comme sur le dev.
          python3 scripts/verif-horloge.py

      - name: Vérifier la décision d'alerte de la caisse (A3)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verif-a3.mjs

      - name: Vérifier le réarmement du son (A1)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verif-a1.mjs

      - name: Vérifier la migration des capacités de caisse (A5)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verif-a5.py

      - name: Vérifier le garde-fou dev du déploiement
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/preuve-garde-dev.py

      - name: Vérifier le contrat de déploiement sans déployer
        shell: bash
        run: |
          set -euo pipefail
          if output="$(python3 tests/deploy-contract.py 2>&1)"; then
            printf '%s\n' "$output"
          else
            printf '%s\n' "$output"
            excerpt="$(printf '%s\n' "$output" | tail -c 1500 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Contrat de déploiement cassé::$excerpt"
            exit 1
          fi
          summary="$(printf '%s\n' "$output" | tail -n 1 | sed 's/%/%25/g')"
          echo "::notice title=Contrat de déploiement (sans déployer)::$summary"


      - name: Créer des identifiants éphémères pour la base locale au runner
        shell: bash
        run: |
          set -euo pipefail
          DB_PASSWORD="$(openssl rand -hex 24)"
          DB_ROOT_PASSWORD="$(openssl rand -hex 24)"
          TUC_WA_SECRET="$(openssl rand -hex 32)"
          # Le test de rejeu (tests/n8n/rejeu-livraison-retardee.php) exige DEUX
          # secrets de 32 caracteres et plus : TUC_WA_SECRET (signature du hook) et
          # TUC_WA_REJEU_POLL_SECRET (son propre droit de polling). Mesure du run
          # 43063990237 : le second n'etait pas dans .env, donc vide, et le test
          # refusait de conclure (« Les secrets éphémères doivent faire au moins 32
          # caractères. ») — il avait raison de refuser, pas de deviner.
          TUC_WA_REJEU_POLL_SECRET="$(openssl rand -hex 32)"
          TUC_N8N_INBOUND_SECRET="$(openssl rand -hex 32)"
          TUC_N8N_POLL_SECRET="$(openssl rand -hex 32)"
          N8N_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          for secret in "$DB_PASSWORD" "$DB_ROOT_PASSWORD" "$TUC_WA_SECRET" "$TUC_N8N_INBOUND_SECRET" "$TUC_N8N_POLL_SECRET" "$TUC_WA_REJEU_POLL_SECRET" "$N8N_ENCRYPTION_KEY"; do
            echo "::add-mask::$secret"
          done
          {
            printf 'TUC_WP_IMAGE=wordpress:php8.2-apache\n'
            printf 'TUC_WP_CLI_IMAGE=wordpress:cli-php8.2\n'
            printf 'TUC_DB_IMAGE=mariadb:10.11\n'
            printf 'TUC_N8N_IMAGE=n8nio/n8n:2.46.6\n'
            printf 'TUC_WP_PORT=8080\n'
            printf 'TUC_N8N_PORT=5678\n'
            printf 'TUC_DB_NAME=tuc_smoke\n'
            printf 'TUC_DB_USER=tuc_smoke\n'
            printf 'TUC_DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'TUC_DB_ROOT_PASSWORD=%s\n' "$DB_ROOT_PASSWORD"
            printf 'TUC_WA_SECRET=%s\n' "$TUC_WA_SECRET"
            printf 'TUC_WA_REJEU_POLL_SECRET=%s\n' "$TUC_WA_REJEU_POLL_SECRET"
            printf 'TUC_N8N_INBOUND_SECRET=%s\n' "$TUC_N8N_INBOUND_SECRET"
            printf 'TUC_N8N_POLL_SECRET=%s\n' "$TUC_N8N_POLL_SECRET"
            printf 'N8N_ENCRYPTION_KEY=%s\n' "$N8N_ENCRYPTION_KEY"
          } > .env

      - name: Valider la configuration Compose
        run: docker compose config --quiet

      - name: Démarrer WordPress et MariaDB
        run: docker compose up --detach --wait --wait-timeout 180 wordpress

      - name: Vérifier WP-CLI
        run: docker compose run --rm --entrypoint wp wpcli cli info

      - name: Installer WordPress avec WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          WP_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$WP_ADMIN_PASSWORD"
          docker compose run --rm --entrypoint wp wpcli core install \
            --url='http://127.0.0.1:8080' \
            --title='TUC WordPress Docker smoke test' \
            --admin_user='tuc-smoke-admin' \
            --admin_password="$WP_ADMIN_PASSWORD" \
            --admin_email='tuc-smoke@example.invalid' \
            --skip-email
          {
            printf 'TUC_SMOKE_ADMIN_USER=tuc-smoke-admin\n'
            printf 'TUC_SMOKE_ADMIN_PASSWORD=%s\n' "$WP_ADMIN_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Activer le plugin et le thème TUC
        run: |
          set -euo pipefail
          docker compose run --rm --entrypoint wp wpcli plugin activate tuc-market-core
          docker compose run --rm --entrypoint wp wpcli theme activate tuc-theme
          docker compose run --rm --entrypoint wp wpcli plugin is-active tuc-market-core
          docker compose run --rm --entrypoint wp wpcli theme is-active tuc-theme
          docker compose run --rm --entrypoint wp wpcli core version

      - name: Vérifier désactivation et réactivation du plugin
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm --entrypoint wp wpcli plugin deactivate tuc-market-core
          inactive_plugins="$(docker compose run --rm --entrypoint wp wpcli plugin list --status=inactive --field=name)"
          printf '%s\n' "$inactive_plugins" | grep -Fx 'tuc-market-core'
          docker compose run --rm --entrypoint wp wpcli plugin activate tuc-market-core
          docker compose run --rm --entrypoint wp wpcli plugin is-active tuc-market-core

      - name: Vérifier la syntaxe du plugin, du thème et des tests PHP
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm --entrypoint sh wpcli -lc '
            find /var/www/html/wp-content/plugins/tuc-market-core \
              /var/www/html/wp-content/themes/tuc-theme \
              /opt/tuc-tests \
              -type f -name "*.php" -print0 | xargs -0 -n1 php -l
          '

      # DEUX identités écrivent dans les uploads, et elles diffèrent :
      #   - le conteneur wordpress (Apache) tourne en www-data ;
      #   - wp-content appartient à l'uid 33, donc wp-cli (`docker compose run`,
      #     sans --user) écrit avec un AUTRE uid.
      # Sans uploads inscriptible par les DEUX, media_handle_sideload() échoue :
      # soumission avec photo -> 500 « tuc_onboarding_photo_save » (le contrat
      # parcours s'arrêtait au cas 60, 0 cas sur 121 exécuté) et le parcours E2E
      # mobile ne retrouve pas le plat publié. Mesuré en CI :
      # « Unable to create directory wp-content/uploads/2026/11 ».
      - name: Rendre wp-content/uploads inscriptible à Apache et à wp-cli
        shell: bash
        run: |
          # 33 = le conteneur wordpress (Apache) ; 82 = www-data dans wp-cli.
          # Les deux écrivent : 1777 (comme /tmp) sinon l'un des deux échoue.
          docker compose run --rm --user root --entrypoint sh wpcli -lc '
            mkdir -p /var/www/html/wp-content/uploads &&
            chown -R 33:33 /var/www/html/wp-content/uploads &&
            chmod 1777 /var/www/html/wp-content/uploads &&
            stat -c "%a %U:%G %n" /var/www/html/wp-content/uploads
          '

      - name: Vérifier que les deux identités peuvent écrire dans uploads
        shell: bash
        run: |
          for u in "" "--user 33" "--user 82"; do
            echo "== docker compose run $u =="
            docker compose run --rm $u --entrypoint sh wpcli -lc 'id -u; touch /var/www/html/wp-content/uploads/.essai-$(id -u) && echo ECRITURE-OK && rm -f /var/www/html/wp-content/uploads/.essai-$(id -u)'
          done

      - name: Exécuter les régressions WordPress/TUC
        shell: bash
        run: |
          set -uo pipefail
          # GitHub’s bash shell enables errexit; disable it while capturing the
          # expected non-zero status so the diagnostic output below can run.
          set +e
          regression_output="$(docker compose run --rm --entrypoint wp wpcli eval-file /opt/tuc-tests/wp-docker-regression.php 2>&1)"
          regression_status=$?
          set -e
          printf '%s\n' "$regression_output"
          if [ "$regression_status" -ne 0 ]; then
            echo "::error title=Regression runner failed::WP-CLI exited with status $regression_status"
            failure_excerpt="$(printf '%s\n' "$regression_output" | grep -E 'ASSERTION_FAILURE:|WA_CART_DEBUG:|PHP_FATAL_DEBUG:|PHP Fatal error|Uncaught|ÉCHEC :' | tail -n 5 | tr '\n' ' ' | cut -c1-1200 | sed 's/%/%25/g; s/\r/%0D/g')"
            if [ -z "$failure_excerpt" ]; then
              failure_excerpt="$(printf '%s\n' "$regression_output" | tr '\n' ' ' | tail -c 1200 | sed 's/%/%25/g; s/\r/%0D/g')"
            fi
            echo "::error title=WP-CLI failure detail::$failure_excerpt"
            exit "$regression_status"
          fi

      - name: Installer le client Playwright
        shell: bash
        run: |
          set -euo pipefail
          if output="$(npm install --prefix "$RUNNER_TEMP/tuc-playwright" --no-audit --no-fund playwright@1.56.1 axe-core@4.10.3 lighthouse@13.6.0 chrome-launcher@1.2.3 2>&1)"; then
            printf '%s\n' "$output"
          else
            status=$?
            printf '%s\n' "$output"
            excerpt="$(printf '%s\n' "$output" | tail -c 1200 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Playwright npm install failed::$excerpt"
            exit "$status"
          fi

      - name: Installer Chromium et ses dépendances système
        shell: bash
        run: |
          set -euo pipefail
          # Ce que le log du run 43038764354 (4 tentatives, 14:40:08Z → 16:05:41Z) montre
          # vraiment, et qui change le remède :
          #  • le runner passe par « Get:1 file:/etc/apt/apt-mirrors.txt Mirrorlist »,
          #    c.-à-d. `mirror+file:` — tant que cette liste pointe `azure.archive.ubuntu.com`,
          #    chaque hôte échoue en cascade et apt attribue la panne au premier nom
          #    (« Temporary failure resolving 'azure.archive.ubuntu.com' » même sur les URL
          #    `security.ubuntu.com`) ;
          #  • `https://packages.microsoft.com/...` a été téléchargé sans peine (764 kB) :
          #    le résolveur n'est pas mort, c'est la liste de miroirs ;
          #  • TOUTES les bibliothèques d'exécution de Chromium sont déjà installées
          #    (`libnss3`, `libgbm1`, `libasound2t64`, `libatk-bridge2.0-0t64`, `xvfb`,
          #    `fonts-liberation`, `fonts-noto-color-emoji`… « is already the newest
          #    version »). Seuls 9 paquets de POLICES restaient à télécharger (fonts-unifont,
          #    xfonts-*, polices CJK/thaï) — et aucun test de ce dépôt ne compare des pixels
          #    (`grep -rl` sur les motifs de capture à comparer dans tests/ = 0 fichier) :
          #    une capture d'écran n'y est qu'un artefact publié, jamais une assertion.
          # D'où, dans l'ordre : une tentative normale, un VRAI correctif de miroir, puis
          # l'installation sans `--with-deps` — acceptée seulement si les deux preuves passent.
          # La liste de paquets demandée à Playwright n'est jamais éditée à la main.
          PW_BIN="$RUNNER_TEMP/tuc-playwright/node_modules/.bin/playwright"
          # Le log du run 355 mesure 13 min 28 s pour cette seule etape : apt
          # rejoue longuement contre un miroir qui ne repond pas. On lui impose
          # une tentative courte — c'est le repli qui doit decider, pas le
          # temporisateur du job. Ces options ne changent AUCUNE liste de
          # paquets, seulement le nombre d'essais et leur delai.
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "10";\n' | sudo tee /etc/apt/apt.conf.d/99tuc-ci-rapide >/dev/null
          status=1; output=""
          if output="$(timeout 420 "$PW_BIN" install --with-deps chromium 2>&1)"; then status=0; fi
          if [ "$status" -ne 0 ]; then
            echo "::notice title=Chromium deps::miroir du runner en défaut — correction de la liste apt puis réessai"
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf 'http://archive.ubuntu.com/ubuntu/\nhttp://security.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
              if [ -f "$f" ]; then
                sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors\.txt#http://archive.ubuntu.com/ubuntu#g' \
                            -e 's#https\?://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
              fi
            done
            timeout 240 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=10 update || true
            # polices : meilleur effort seul (elles ne portent aucune assertion)
            if ! timeout 300 sudo apt-get install -y --fix-missing fonts-unifont fonts-freefont-ttf xfonts-scalable xfonts-encodings xfonts-utils xfonts-cyrillic >/dev/null 2>&1; then
              echo "polices optionnelles non récupérées — sans effet sur les assertions, la preuve ci-dessous tranche"
            fi
            if output="$(timeout 420 "$PW_BIN" install --with-deps chromium 2>&1)"; then status=0; fi
          fi
          if [ "$status" -ne 0 ]; then
            echo "::notice title=Chromium deps::apt toujours indisponible — installation sans --with-deps, la preuve décidera"
            if output="$(timeout 600 "$PW_BIN" install chromium 2>&1)"; then
              status=0; SANS_DEPS=1
            else
              printf '%s\n' "$output" | tail -n 20
            fi
          fi
          # PREUVE 1 — les dépendances système sont réellement présentes : `ldd` sur le
          # binaire, aucune bibliothèque non résolue, quel que soit le chemin suivi.
          CHROME="$(find "$HOME/.cache/ms-playwright" -maxdepth 4 -type f \( -name chrome -o -name headless_shell \) 2>/dev/null | head -1)"
          deps_ok=1
          if [ -n "$CHROME" ]; then
            if ldd_out="$(ldd "$CHROME" 2>&1)"; then
              manquantes="$(printf '%s\n' "$ldd_out" | awk '/not found/ {print $1}' | sort -u | tr '\n' ' ')"
              n_res="$(printf '%s\n' "$ldd_out" | grep -c '=> /')"
              if [ -n "$manquantes" ]; then
                echo "DEPENDANCES_MANQUANTES : $manquantes"; deps_ok=0
              elif [ "$n_res" -lt 10 ]; then
                echo "DEPENDANCES_SUSPECTES : $n_res bibliothèque(s) résolue(s) sur $(basename "$CHROME")"; deps_ok=0
              else
                echo "binaire navigateur : $(basename "$CHROME") — ldd sans bibliothèque manquante ($n_res résolues)${SANS_DEPS:+, installé sans --with-deps}"
              fi
            else
              echo "ldd refusé sur $(basename "$CHROME") : $(printf '%s\n' "$ldd_out" | head -n 1)"; deps_ok=0
            fi
          else
            echo "DEPENDANCES_MANQUANTES : aucun binaire Chromium sous ~/.cache/ms-playwright"; deps_ok=0
          fi
          # PREUVE 2 — le navigateur s'exécute pour de vrai, tout de suite : un doute sur
          # les dépendances rougit ICI, pas huit étapes plus bas.
          if [ "$status" -eq 0 ] && [ "$deps_ok" -eq 1 ]; then
            if ! sortie_navig="$(PW_ROOT="$RUNNER_TEMP/tuc-playwright" node -e '
              const { chromium } = require(process.env.PW_ROOT + "/node_modules/playwright");
              (async () => {
                const b = await chromium.launch({ args: ["--no-sandbox"] });
                const p = await b.newPage();
                await p.setContent("<title>tuc</title><h1>navigateur pret</h1>");
                console.log("titre=" + (await p.title()) + " h1=" + (await p.textContent("h1")));
                await b.close();
              })().catch((e) => { console.error("ECHEC_NAVIGATEUR : " + e.message); process.exit(1); });
            ' 2>&1)"; then
              printf '%s\n' "$sortie_navig"; status=1
            else
              printf 'navigateur : %s\n' "$sortie_navig"
            fi
          fi
          if [ "$status" -ne 0 ] || [ "$deps_ok" -ne 1 ]; then
            excerpt="$(printf '%s\n' "$output" | tail -c 1200 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Chromium install failed::$excerpt"
            exit 1
          fi

      - name: Vérifier le contrat sonore et les notifications push
        run: |
          node --check tests/push-notification-contract.js
          node tests/push-notification-contract.js

      - name: Créer un restaurant et un compte restaurateur synthétiques
        shell: bash
        run: |
          set -euo pipefail
          mobile_password="$(openssl rand -hex 24)"
          echo "::add-mask::$mobile_password"
          docker compose run --rm -e TUC_MOBILE_E2E_PASSWORD="$mobile_password" \
            --entrypoint wp wpcli eval-file /opt/tuc-tests/wp-mobile-fixtures.php
          {
            printf 'TUC_MOBILE_E2E_USER=tuc-mobile-e2e\n'
            printf 'TUC_MOBILE_E2E_SERVER_USER=tuc-mobile-server\n'
            printf 'TUC_MOBILE_E2E_CASHIER_USER=tuc-mobile-cashier\n'
            printf 'TUC_MOBILE_E2E_PASSWORD=%s\n' "$mobile_password"
          } >> "$GITHUB_ENV"

      - name: Parcours E2E mobile navigateur sur WordPress Docker
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/tuc-playwright/node_modules
          TUC_MOBILE_E2E_URL: http://127.0.0.1:8080
          TUC_MOBILE_E2E_ARTIFACTS: ${{ runner.temp }}/tuc-mobile-e2e-artifacts
        run: |
          set -euo pipefail
          node --check tests/mobile-e2e.js
          if output="$(node tests/mobile-e2e.js 2>&1)"; then
            printf '%s\n' "$output"
          else
            status=$?
            printf '%s\n' "$output"
            excerpt="$(printf '%s\n' "$output" | tail -c 1800 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Mobile browser E2E failed::$excerpt"
            exit "$status"
          fi

      - name: Publier les captures du parcours mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuc-wordpress-mobile-e2e
          path: ${{ runner.temp }}/tuc-mobile-e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Préparer les fixtures du parcours WhatsApp E2E
        run: |
          set -euo pipefail
          docker compose run --rm -e TUC_N8N_E2E_PHASE=setup \
            --entrypoint wp wpcli eval-file /opt/tuc-tests/n8n/whatsapp-e2e.php

      - name: Importer et activer le workflow n8n de test
        shell: bash
        run: |
          set -euo pipefail
          N8N_SETUP_LOG="$RUNNER_TEMP/tuc-n8n-setup.log"
          : > "$N8N_SETUP_LOG"
          on_n8n_setup_error() {
            local status=$? failed_command="$BASH_COMMAND" failed_line="$LINENO" n8n_logs
            n8n_logs="$(docker compose logs --no-color n8n 2>/dev/null | tail -n 40 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g' || true)"
            echo "::error title=n8n setup command failed::line=$failed_line status=$status command=$failed_command logs=$n8n_logs"
          }
          trap on_n8n_setup_error ERR
          run_n8n_cli() {
            local output status excerpt
            if output="$(docker compose run --rm --entrypoint n8n n8n "$@" 2>&1)"; then
              printf 'SUCCESS: n8n %s\n' "$*" >> "$N8N_SETUP_LOG"
              printf 'n8n command succeeded: %s\n' "$*"
            else
              status=$?
              excerpt="$(printf '%s\n' "$output" | tail -c 800 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
              printf 'FAILED COMMAND: n8n %s (status %s) detail: %s\n' "$*" "$status" "$excerpt" >> "$N8N_SETUP_LOG"
              echo "::error title=n8n CLI failed::$excerpt"
              return "$status"
            fi
          }
          run_n8n_cli import:workflow --input=/opt/tuc-n8n/tuc-wa-smoke.workflow.json
          if output="$(docker compose up --detach n8n 2>&1)"; then
            printf 'COMMAND: docker compose up n8n\n%s\n' "$output" >> "$N8N_SETUP_LOG"
            printf '%s\n' "$output"
          else
            status=$?
            printf 'FAILED COMMAND: docker compose up n8n (status %s)\n%s\n' "$status" "$output" >> "$N8N_SETUP_LOG"
            echo "::error title=n8n container failed to start::$(printf '%s' "$output" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            exit "$status"
          fi
          if curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors \
            http://127.0.0.1:5678/healthz --output /dev/null; then
            printf 'n8n health endpoint is ready\n' >> "$N8N_SETUP_LOG"
          else
            status=$?
            n8n_logs="$(docker compose logs --no-color n8n 2>/dev/null | tail -n 30 || true)"
            printf 'n8n health check failed (status %s)\n%s\n' "$status" "$n8n_logs" >> "$N8N_SETUP_LOG"
            excerpt="$(printf '%s\n' "$n8n_logs" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=n8n failed readiness::$excerpt"
            exit 1
          fi
          run_n8n_cli publish:workflow --id=f31a00c7-d902-4f4a-91fa-61176d0c39f7
          # Restart after the CLI publish to force the server to load the new
          # published version and register its production webhook route.
          if output="$(docker compose restart n8n 2>&1)"; then
            printf 'COMMAND: docker compose restart n8n\n%s\n' "$output" >> "$N8N_SETUP_LOG"
            printf '%s\n' "$output"
          else
            status=$?
            echo "::error title=n8n restart after publish failed::$output"
            exit "$status"
          fi
          if curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors \
            http://127.0.0.1:5678/healthz --output /dev/null; then
            printf 'n8n health endpoint is ready after publish\n' >> "$N8N_SETUP_LOG"
          else
            status=$?
            n8n_logs="$(docker compose logs --no-color n8n 2>&1 | tail -n 30 || true)"
            excerpt="$(printf '%s\n' "$n8n_logs" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=n8n failed readiness after publish::$excerpt"
            exit "$status"
          fi
          if output="$(docker compose run --rm --entrypoint n8n n8n list:workflow 2>&1)"; then
            printf 'WORKFLOW LIST:\n%s\n' "$output" >> "$N8N_SETUP_LOG"
            printf 'n8n workflows after publish:\n%s\n' "$output"
          else
            status=$?
            echo "::error title=n8n workflow listing failed::$output"
            exit "$status"
          fi
          if output="$(docker compose run --rm --entrypoint sh n8n -lc 'n8n export:workflow --id=f31a00c7-d902-4f4a-91fa-61176d0c39f7 --output=/tmp/tuc-workflow.json >/dev/null && printf "TUC_WORKFLOW_JSON_START\\n" && cat /tmp/tuc-workflow.json && printf "\\nTUC_WORKFLOW_JSON_END\\n"' 2>&1)"; then
            workflow_json="$(printf '%s\n' "$output" | sed -n '/^TUC_WORKFLOW_JSON_START$/,/^TUC_WORKFLOW_JSON_END$/p' | sed '1d;$d')"
            workflow_state="$(printf '%s\n' "$workflow_json" | python3 -c 'import json, sys; data=json.load(sys.stdin); workflow=data[0] if isinstance(data, list) else data; assert workflow.get("active") is True, workflow; print("active")')"
            printf 'n8n workflow publication state: %s\n' "$workflow_state"
            printf 'WORKFLOW PUBLISH STATE: %s\n' "$workflow_state" >> "$N8N_SETUP_LOG"
          else
            status=$?
            echo "::error title=n8n workflow state inspection failed::$output"
            exit "$status"
          fi

      - name: Tester n8n, webhook signé, anti-rejeu et lien magique
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          if output="$(python3 tests/n8n/send-smoke-events.py 2>&1)"; then
            printf '%s\n' "$output"
          else
            status=$?
            printf '%s\n' "$output"
            excerpt="$(printf '%s\n' "$output" | tail -c 1000 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            n8n_logs="$(docker compose logs --no-color n8n 2>&1 | tail -n 40 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g' || true)"
            echo "::error title=n8n webhook test failed::$excerpt"
            echo "::error title=n8n runtime logs::$n8n_logs"
            exit "$status"
          fi
          if output="$(docker compose run --rm -e TUC_N8N_E2E_PHASE=verify \
            --entrypoint wp wpcli eval-file /opt/tuc-tests/n8n/whatsapp-e2e.php 2>&1)"; then
            printf '%s\n' "$output"
          else
            status=$?
            printf '%s\n' "$output"
            excerpt="$(printf '%s\n' "$output" | tail -c 1400 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=WordPress magic-link E2E failed::$excerpt"
            exit "$status"
          fi

      - name: Tester le rejeu d'une livraison WhatsApp retardée (n8n, sans envoi réel)
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          # setup puis verify dans le MÊME conteneur : le contrat passe par le
          # cache d'objets, deux `run --rm` séparés perdraient le transient posé
          # au setup (mesuré en bac local : le drop-in de cache rend un transient
          # invisible au processus CLI suivant). En CI, mysql est le backend.
          if ! output="$(docker compose run --rm \
              -e TUC_WA_REJEU_PAS=setup -e TUC_WA_REJEU_MONO_PASSE=1 \
              -e TUC_WA_SECRET -e TUC_WA_REJEU_POLL_SECRET \
              --entrypoint wp wpcli eval-file /opt/tuc-tests/n8n/rejeu-livraison-retardee.php 2>&1)"; then
            printf '%s\n' "$output"
            excerpt="$(printf '%s\n' "$output" | tail -c 1400 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=WhatsApp delayed-delivery replay test failed::$excerpt"
            exit 1
          fi
          printf '%s\n' "$output"

      - name: Vérifier les dix scénarios de commande client et restaurant
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/tuc-playwright/node_modules
          TUC_MOBILE_E2E_URL: http://127.0.0.1:8080
          TUC_N8N_URL: http://127.0.0.1:5678
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          node --check tests/checkout-scenarios.js
          if output="$(node tests/checkout-scenarios.js 2>&1)"; then
            printf '%s\n' "$output"
          else
            status=$?
            printf '%s\n' "$output"
            excerpt="$(printf '%s\n' "$output" | tail -c 1800 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Ten checkout scenarios failed::$excerpt"
            exit "$status"
          fi

      - name: Parcours mobile de demande et d’accès restaurateur via n8n
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/tuc-playwright/node_modules
          TUC_MOBILE_E2E_URL: http://127.0.0.1:8080
          TUC_N8N_URL: http://127.0.0.1:5678
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          node --check tests/restaurant-onboarding-e2e.js
          if output="$(node tests/restaurant-onboarding-e2e.js 2>&1)"; then
            printf '%s\n' "$output"
          else
            status=$?
            printf '%s\n' "$output"
            excerpt="$(printf '%s\n' "$output" | tail -c 1800 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Restaurant onboarding E2E failed::$excerpt"
            exit "$status"
          fi

      - name: Exporter le formulaire WordPress réel pour le test NVDA
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/tuc-playwright/node_modules
          TUC_MOBILE_E2E_URL: http://127.0.0.1:8080
          TUC_NVDA_FIXTURE_DIR: ${{ runner.temp }}/tuc-onboarding-nvda-fixture
        run: |
          set -euo pipefail
          node tests/export-onboarding-nvda-fixture.js
          git rev-parse HEAD > "$RUNNER_TEMP/tuc-onboarding-nvda-fixture/source-commit.txt"
          grep -q 'Nom du restaurant' "$RUNNER_TEMP/tuc-onboarding-nvda-fixture/index.html"
          grep -q 'Demander l’accompagnement' "$RUNNER_TEMP/tuc-onboarding-nvda-fixture/index.html"

      - name: Publier le formulaire rendu pour le lecteur d’écran Windows
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-nvda-fixture
          path: ${{ runner.temp }}/tuc-onboarding-nvda-fixture/
          if-no-files-found: error
          retention-days: 1

      - name: Audit web professionnel (Lighthouse mobile, SEO, WCAG, responsive, REST)
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/tuc-playwright/node_modules
          TUC_MOBILE_E2E_URL: http://127.0.0.1:8080
          TUC_AUDIT_REPORT_PATH: ${{ runner.temp }}/tuc-professional-audit.json
        run: |
          set -euo pipefail
          node --check tests/professional-audit.js
          node tests/professional-audit.js

      - name: Publier le rapport de qualité web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuc-professional-audit
          path: ${{ runner.temp }}/tuc-professional-audit.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Vérifier HTTP, REST et la version PHP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-connrefused \
            http://127.0.0.1:8080/ --output /dev/null
          health="$(curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-connrefused \
            http://127.0.0.1:8080/wp-json/tuc/v1/sante)"
          printf '%s' "$health" | python3 -c '
          import json, sys
          result = json.load(sys.stdin)
          assert result.get("ok") is True, result
          assert all(result.get("modules", {}).get(key) is True for key in ("cpt_resto", "cpt_menu", "cpt_commande")), result
          print("REST health OK · plugin", result.get("plugin"), "· WordPress", result.get("wp"), "· PHP", result.get("php"))
          '
          docker compose exec --no-TTY wordpress php -v

      - name: Échouer sur une erreur PHP fatale du site
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec --no-TTY wordpress sh -lc '
            if [ -f /var/www/html/wp-content/debug.log ] &&
              grep -E "PHP Fatal error|Uncaught Error" /var/www/html/wp-content/debug.log; then
              exit 1
            fi
          '

      - name: Journaux Docker et erreurs PHP en cas d’échec
        if: failure()
        shell: bash
        run: |
          docker compose logs --no-color || true
          n8n_container_state="$(docker compose ps --all n8n 2>&1 | tail -n 10 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g' || true)"
          n8n_container_logs="$(docker compose logs --no-color n8n 2>&1 | tail -n 60 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g' || true)"
          echo "::error title=n8n container state::$n8n_container_state"
          echo "::error title=n8n container logs::$n8n_container_logs"
          if [ -s "$RUNNER_TEMP/tuc-n8n-setup.log" ]; then
            n8n_setup_log="$(tail -c 1200 "$RUNNER_TEMP/tuc-n8n-setup.log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=n8n setup transcript::$n8n_setup_log"
          fi
          if docker compose exec --no-TTY wordpress sh -lc 'test -f /var/www/html/wp-content/debug.log'; then
            debug_log="$(docker compose exec --no-TTY wordpress sh -lc 'tail -n 100 /var/www/html/wp-content/debug.log' || true)"
            printf '%s\n' "$debug_log"
            {
              echo '### WordPress debug.log'
              echo '```text'
              printf '%s\n' "$debug_log" | tail -n 100
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            fatal_line="$(printf '%s\n' "$debug_log" | grep -E 'PHP Fatal error|Uncaught|TypeError|Error:' | tail -n 1 | tr '\n' ' ' | cut -c1-900)"
            if [ -n "$fatal_line" ]; then
              echo "::error title=WordPress PHP error::$fatal_line"
            fi
          fi
          if docker compose exec --no-TTY wordpress sh -lc 'test -f /var/www/html/wp-content/tuc-regression-progress.log'; then
            progress_log="$(docker compose exec --no-TTY wordpress sh -lc 'cat /var/www/html/wp-content/tuc-regression-progress.log' || true)"
            printf '%s\n' "$progress_log"
            {
              echo '### WordPress regression progress'
              echo '```text'
              printf '%s\n' "$progress_log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            last_progress="$(printf '%s\n' "$progress_log" | tail -n 1 | tr '\n' ' ' | cut -c1-900)"
            if [ -n "$last_progress" ]; then
              echo "::error title=Last WordPress regression stage::$last_progress"
            fi
          fi

      - name: Nettoyer les conteneurs, volumes et identifiants éphémères
        if: always()
        run: |
          docker compose down --volumes --remove-orphans || true
          rm -f .env

  # ===========================================================================
  # HEIC — conversion RÉELLE avec un décodeur réellement présent (revue n°18,
  # point 4). Job SÉPARÉ parce que `wordpress:cli-php8.2` n'embarque pas de
  # décodeur HEIC : mesuré dans le run 42926883487, `Imagick::queryFormats
  # ('HEIC')` y est vide (« décodeur HEIC : non », trois fois dans le log).
  # Le job principal continue donc de prouver l'AUTRE moitié de l'exigence :
  # sans décodeur, la conversion est refusée proprement et le log le dit.
  # Règles de ce job : décodeur absent => ROUGE ; décodeur présent et conversion
  # en échec => ROUGE ; conversion réussie => VERT. Aucun continue-on-error,
  # aucun skip, aucun repli. La logique est dans tests/ci-heic-decodeur.sh
  # (monté en /opt/tuc-tests) : rien à lire ici, rien à revalider à chaque
  # retouche, et la partie « contrôles négatifs » est rejouable hors CI.
  # ===========================================================================
  heic-decodeur:
    name: HEIC — conversion réelle (décodeur présent, obligatoire)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      # Mêmes variables que le job principal : compose.yaml exige TUC_N8N_* et
      # N8N_ENCRYPTION_KEY même sans démarrer n8n (l'évaluation porte sur tous
      # les services du fichier).
      - name: Créer des identifiants éphémères pour la base locale au runner
        shell: bash
        run: |
          set -euo pipefail
          DB_PASSWORD="$(openssl rand -hex 24)"
          DB_ROOT_PASSWORD="$(openssl rand -hex 24)"
          TUC_WA_SECRET="$(openssl rand -hex 32)"
          TUC_N8N_INBOUND_SECRET="$(openssl rand -hex 32)"
          TUC_N8N_POLL_SECRET="$(openssl rand -hex 32)"
          N8N_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          for secret in "$DB_PASSWORD" "$DB_ROOT_PASSWORD" "$TUC_WA_SECRET" "$TUC_N8N_INBOUND_SECRET" "$TUC_N8N_POLL_SECRET" "$N8N_ENCRYPTION_KEY"; do
            echo "::add-mask::$secret"
          done
          {
            printf 'TUC_WP_IMAGE=wordpress:php8.2-apache\n'
            printf 'TUC_WP_CLI_IMAGE=wordpress:cli-php8.2\n'
            printf 'TUC_DB_IMAGE=mariadb:10.11\n'
            printf 'TUC_N8N_IMAGE=n8nio/n8n:2.46.6\n'
            printf 'TUC_WP_PORT=8080\n'
            printf 'TUC_N8N_PORT=5678\n'
            printf 'TUC_DB_NAME=tuc_heic\n'
            printf 'TUC_DB_USER=tuc_heic\n'
            printf 'TUC_DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'TUC_DB_ROOT_PASSWORD=%s\n' "$DB_ROOT_PASSWORD"
            printf 'TUC_WA_SECRET=%s\n' "$TUC_WA_SECRET"
            printf 'TUC_N8N_INBOUND_SECRET=%s\n' "$TUC_N8N_INBOUND_SECRET"
            printf 'TUC_N8N_POLL_SECRET=%s\n' "$TUC_N8N_POLL_SECRET"
            printf 'N8N_ENCRYPTION_KEY=%s\n' "$N8N_ENCRYPTION_KEY"
          } > .env

      - name: Valider la configuration Compose
        run: docker compose config --quiet

      - name: Démarrer WordPress et MariaDB
        run: docker compose up --detach --wait --wait-timeout 180 wordpress

      - name: Installer WordPress et activer le plugin TUC
        shell: bash
        run: |
          set -euo pipefail
          WP_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$WP_ADMIN_PASSWORD"
          docker compose run --rm --entrypoint wp wpcli core install \
            --url='http://127.0.0.1:8080' \
            --title='TUC HEIC - job a decodeur' \
            --admin_user='tuc-heic-admin' \
            --admin_password="$WP_ADMIN_PASSWORD" \
            --admin_email='tuc-heic@example.invalid' \
            --skip-email
          docker compose run --rm --entrypoint wp wpcli plugin activate tuc-market-core
          docker compose run --rm --entrypoint wp wpcli plugin is-active tuc-market-core

      # UNE seule invocation `docker compose run` : `--rm` détruit le conteneur,
      # donc installer dans une étape et tester dans la suivante testerait une
      # image qui n'a rien reçu.
      - name: Installer un VRAI décodeur HEIC et exiger la conversion
        shell: bash
        run: |
          set -euo pipefail
          # Mesure du run 43060893203 : lance dans `wpcli`, le script echouait
          # sur « /opt/tuc-tests/ci-heic-decodeur.sh: line 49: apt-get: command
          # not found » — l'image `wordpress:cli-php8.2` est Alpine. Le binaire
          # PHP de cette image ne peut pas charger le paquet distribue Debian,
          # et le `mktemp` de BusyBox refuse un gabarit a suffixe. Le controle
          # est donc deplace dans `wordpress` (`wordpress:php8.2-apache`,
          # Debian : apt + coreutils + le PHP qui sert vraiment le site), qui
          # monte le meme volume que wpcli. Le montage /opt/tuc-tests n'existant
          # que dans wpcli, les tests sont copies dans le conteneur qui les
          # execute.
          docker compose cp tests wordpress:/opt/tuc-tests
          docker compose exec --no-TTY --user root wordpress bash -c \
            'TUC_APT_INSTALL=1 TUC_TESTS_DIR=/opt/tuc-tests bash /opt/tuc-tests/ci-heic-decodeur.sh'

      - name: Publier le debug.log WordPress (utile seulement en cas de rouge)
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          docker compose run --rm --user root --entrypoint sh wpcli -lc \
            'tail -n 200 /var/www/html/wp-content/debug.log 2>/dev/null || echo "(pas de debug.log)"'

  nvda-windows:
    name: NVDA réel, eSpeak intégré, sortie WAV sans pilote
    needs: wordpress-docker
    # Le job Windows coute 15 min de runner ; il n'a de sens que pour le tronc
    # (PR vers main et push sur main). Une poussee sur develop le saute : ce qui
    # compte la-bas, c'est de savoir si ce qui va etre DEPLOYE tient debout.
    if: github.ref != 'refs/heads/develop'
    env:
      NVDA_VERSION: '2026.3'
      NVDA_SHA256: a8a87cb823da0c62cfbae4a444ae5ae238d54dc82ad6d46d3fdb3fef082799b2
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Télécharger le formulaire WordPress
        uses: actions/download-artifact@v4
        with:
          name: onboarding-nvda-fixture
          path: ${{ runner.temp }}/tuc-onboarding-nvda-fixture

      - name: Installer Playwright et pywinauto
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'tuc-playwright'
          npm install --prefix $prefix --no-audit --no-fund playwright@1.56.1
          if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed' }
          & (Join-Path $prefix 'node_modules/.bin/playwright.cmd') install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }
          python -m pip install --disable-pip-version-check pywinauto==0.6.9
          if ($LASTEXITCODE -ne 0) { throw 'pywinauto installation failed' }

      - name: Installer NVDA portable vérifié
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'nvda.exe'
          $uri = "https://github.com/nvaccess/nvda/releases/download/release-$env:NVDA_VERSION/nvda_$env:NVDA_VERSION.exe"
          $downloaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $uri -OutFile $installer -TimeoutSec 90
              $downloaded = $true
              break
            } catch {
              Write-Warning "NVDA download attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
          }
          if (-not $downloaded) { throw 'NVDA release download failed after three attempts' }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:NVDA_SHA256) { throw "NVDA checksum mismatch: $hash" }
          $portable = Join-Path $env:RUNNER_TEMP 'nvda-portable'
          $process = Start-Process -FilePath $installer -ArgumentList @('--create-portable-silent', "--portable-path=$portable") -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(90000)) { Stop-Process -Id $process.Id -Force; throw 'NVDA portable creation timed out' }
          if ($process.ExitCode -ne 0) { throw "NVDA portable creation failed: $($process.ExitCode)" }
          $exe = Get-ChildItem -Path $portable -Filter nvda.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Portable nvda.exe not found' }
          "TUC_NVDA_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NVDA portable $env:NVDA_VERSION verified: $hash" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Préparer le profil isolé et le sink PCM
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'nvda-config'
          $synth = Join-Path $config 'scratchpad/synthDrivers'
          New-Item -ItemType Directory -Force -Path $synth | Out-Null
          Copy-Item tests/nvda/espeak_capture.py (Join-Path $synth 'espeak.py')
          Copy-Item tests/nvda/tuc_wav_sink.py (Join-Path $synth 'tuc_wav_sink.py')
          @'
          schemaVersion = 2
          [general]
          language = en
          showWelcomeDialogAtStartup = False
          askToExit = False
          playStartAndExitSounds = False
          loggingLevel = INFO
          [update]
          askedAllowUsageStats = True
          autoCheck = False
          startupNotification = False
          allowUsageStats = False
          [development]
          enableScratchpadDir = True
          [speech]
          synth = espeak
          autoLanguageSwitching = True
          autoDialectSwitching = True
          reportNotSupportedLanguage = speech
          [[espeak]]
          voice = fr-fr
          rate = 50
          [audio]
          outputDevice = default
          audioAwakeTime = 0
          audioDuckingMode = 0
          [virtualBuffers]
          autoSayAllOnPageLoad = False
          passThroughAudioIndication = False
          [braille]
          display = noBraille
          '@ | Set-Content (Join-Path $config 'nvda.ini') -Encoding utf8
          $capture = Join-Path $env:RUNNER_TEMP 'nvda-capture'
          New-Item -ItemType Directory -Force -Path $capture | Out-Null
          @"
          TUC_NVDA_CONFIG=$config
          TUC_NVDA_CAPTURE_DIR=$capture
          TUC_NVDA_FIXTURE_DIR=$env:RUNNER_TEMP\tuc-onboarding-nvda-fixture
          TUC_NVDA_REPORT=$env:RUNNER_TEMP\nvda-report.json
          NODE_PATH=$env:RUNNER_TEMP\tuc-playwright\node_modules
          "@ | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Démarrer NVDA et refuser tout repli sur OneCore
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'nvda.log'
          $arguments = @("--config-path=$env:TUC_NVDA_CONFIG", "--log-file=$log", '--debug-logging')
          $process = Start-Process -FilePath $env:TUC_NVDA_EXE -ArgumentList $arguments -PassThru
          "TUC_NVDA_PID=$($process.Id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $proof = Join-Path $env:TUC_NVDA_CAPTURE_DIR 'native-espeak-initialized.json'
          $deadline = (Get-Date).AddSeconds(45)
          while (-not (Test-Path $proof) -and (Get-Date) -lt $deadline) {
            if ($process.HasExited) { throw "NVDA exited before initialization: $($process.ExitCode)" }
            Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path $proof)) { throw 'Native eSpeak file sink did not initialize; refusing OneCore fallback' }
          $evidence = Get-Content $proof -Raw | ConvertFrom-Json
          if ($evidence.synth -ne 'espeak' -or $evidence.class_module -ne 'nvdaBuiltin.synthDrivers.espeak') { throw 'Wrong synthesizer implementation' }
          $effective = Get-Content (Join-Path $env:TUC_NVDA_CONFIG 'nvda.ini') -Raw
          if ($effective -notmatch 'synth\s*=\s*espeak') { throw 'NVDA changed the configured synthesizer' }
          Add-Content $env:GITHUB_STEP_SUMMARY "### Preuve du moteur`n````json`n$(Get-Content $proof -Raw)`n````"
          Write-Output 'PASS: NVDA loaded its bundled eSpeak engine with the CI PCM sink.'

      - name: Parcours clavier Windows et annonces NVDA
        shell: pwsh
        timeout-minutes: 5
        run: |
          node --check tests/nvda/native-espeak-smoke.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax error' }
          node tests/nvda/native-espeak-smoke.js *> (Join-Path $env:RUNNER_TEMP 'nvda-node.log')
          $testExit = $LASTEXITCODE
          Get-Content (Join-Path $env:RUNNER_TEMP 'nvda-node.log') -Encoding UTF8
          if ($testExit -ne 0) {
            $detail = Get-Content (Join-Path $env:RUNNER_TEMP 'nvda-node.log') -Raw -Encoding UTF8
            $oneLine = ($detail -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A')
            if ($oneLine.Length -gt 28000) { $oneLine = $oneLine.Substring(0,28000) }
            Write-Output "::error title=Native NVDA test failure::$oneLine"
            throw 'Native NVDA keyboard test failed; see report and NVDA log artifacts'
          }

      - name: Arrêter proprement NVDA et finaliser les WAV
        if: always()
        shell: pwsh
        run: |
          if ($env:TUC_NVDA_EXE) {
            $quit = Start-Process -FilePath $env:TUC_NVDA_EXE -ArgumentList @('--quit', "--config-path=$env:TUC_NVDA_CONFIG") -PassThru -WindowStyle Hidden
            if (-not $quit.WaitForExit(15000)) { Stop-Process -Id $quit.Id -Force -ErrorAction SilentlyContinue }
            $native = Get-Process -Name nvda -ErrorAction SilentlyContinue
            $deadline = (Get-Date).AddSeconds(15)
            while ($native -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $native = Get-Process -Name nvda -ErrorAction SilentlyContinue
            }
            if ($native) {
              Write-Warning 'NVDA did not exit gracefully; partial WAV headers may need recovery.'
              $native | Stop-Process -Force
            }
          }

      - name: Valider les annonces et le PCM français/arabe
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'nvda-audio'
          python tests/nvda/validate_capture.py --capture $env:TUC_NVDA_CAPTURE_DIR --output $output *> (Join-Path $env:RUNNER_TEMP 'nvda-validation.log')
          $validationExit = $LASTEXITCODE
          $detail = Get-Content (Join-Path $env:RUNNER_TEMP 'nvda-validation.log') -Raw -Encoding UTF8
          Write-Output $detail
          if ($validationExit -ne 0) {
            $oneLine = ($detail -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A')
            Write-Output "::error title=NVDA PCM validation::$oneLine"
            throw 'NVDA built-in eSpeak proof failed'
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "### WAV issus du moteur eSpeak intégré à NVDA`n````json`n$(Get-Content (Join-Path $output 'manifest.json') -Raw)`n````"

      - name: Afficher les diagnostics NVDA même en cas d'échec
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'nvda.log'
          $detail = ''
          if (Test-Path $log) {
            $lines = Get-Content $log -Encoding UTF8
            $selected = $lines | Select-String -Pattern 'espeak|tuc_wav|Traceback|ERROR|CRITICAL|setSynth|Scratchpad' -Context 2,8 | Out-String
            $detail = $selected + "`nLOG TAIL:`n" + (($lines | Select-Object -Last 70) -join "`n")
          } else { $detail = 'NVDA log file absent' }
          $captureFiles = Get-ChildItem $env:TUC_NVDA_CAPTURE_DIR -ErrorAction SilentlyContinue | Select-Object Name,Length | Out-String
          $detail += "`nCAPTURE FILES:`n$captureFiles"
          $report = Join-Path $env:RUNNER_TEMP 'nvda-report.json'
          if (Test-Path $report) { $detail += "`nTEST REPORT:`n" + (Get-Content $report -Raw -Encoding UTF8) }
          $detail += "`nCAPTURED UTTERANCES:`n"
          Get-ChildItem $env:TUC_NVDA_CAPTURE_DIR -Filter '*.json' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^\d+' } | ForEach-Object {
            $item = Get-Content $_.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
            $detail += "[$($_.Name)] complete=$($item.complete) reason=$($item.reason) text=$($item.text) languages=$($item.languages | ConvertTo-Json -Compress)`n"
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "### Diagnostic NVDA`n````text`n$detail`n````"
          $oneLine = ($detail -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A')
          if ($oneLine.Length -gt 28000) { $oneLine = $oneLine.Substring($oneLine.Length - 28000) }
          Write-Output "::notice title=NVDA startup diagnostic::$oneLine"

      - name: Publier les preuves et diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-native-espeak-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nvda-capture/
            ${{ runner.temp }}/nvda-audio/
            ${{ runner.temp }}/nvda-report.json
            ${{ runner.temp }}/nvda-node.log
            ${{ runner.temp }}/nvda-validation.log
            ${{ runner.temp }}/nvda.log
            ${{ runner.temp }}/nvda-config/nvda.ini
            ${{ runner.temp }}/tuc-onboarding-nvda-fixture/source-commit.txt
          if-no-files-found: warn
          retention-days: 7
