name: tuc-wordpress-local

services:
  db:
    image: ${TUC_DB_IMAGE:-mariadb:10.11}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${TUC_DB_NAME:?Copiez .env.example vers .env et renseignez les valeurs locales}
      MARIADB_USER: ${TUC_DB_USER:?Renseignez TUC_DB_USER dans .env}
      MARIADB_PASSWORD: ${TUC_DB_PASSWORD:?Renseignez TUC_DB_PASSWORD dans .env}
      MARIADB_ROOT_PASSWORD: ${TUC_DB_ROOT_PASSWORD:?Renseignez TUC_DB_ROOT_PASSWORD dans .env}
    volumes:
      - tuc_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  wpcli:
    image: ${TUC_WP_CLI_IMAGE:-wordpress:cli-php8.2}
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${TUC_DB_NAME:?Renseignez TUC_DB_NAME dans .env}
      WORDPRESS_DB_USER: ${TUC_DB_USER:?Renseignez TUC_DB_USER dans .env}
      WORDPRESS_DB_PASSWORD: ${TUC_DB_PASSWORD:?Renseignez TUC_DB_PASSWORD dans .env}
      TUC_WA_SECRET: ${TUC_WA_SECRET:?Renseignez TUC_WA_SECRET dans .env}
      TUC_N8N_POLL_SECRET: ${TUC_N8N_POLL_SECRET:?Renseignez TUC_N8N_POLL_SECRET dans .env}
    volumes:
      - tuc_wp_data:/var/www/html
      - ./wordpress/tuc-market-core:/var/www/html/wp-content/plugins/tuc-market-core:ro
      - ./wordpress/tuc-theme:/var/www/html/wp-content/themes/tuc-theme:ro
      - ./tests:/opt/tuc-tests:ro

  n8n:
    image: ${TUC_N8N_IMAGE:-n8nio/n8n:2.46.6}
    profiles: ["tools"]
    ports:
      - "127.0.0.1:${TUC_N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set}
      N8N_USE_WORKFLOW_PUBLICATION_SERVICE: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_WEBHOOK_URL: http://localhost:${TUC_N8N_PORT:-5678}/
      TUC_N8N_INBOUND_SECRET: ${TUC_N8N_INBOUND_SECRET:?TUC_N8N_INBOUND_SECRET must be set}
      TUC_WA_SECRET: ${TUC_WA_SECRET:?TUC_WA_SECRET must be set}
    volumes:
      - tuc_n8n_data:/home/node/.n8n
      - ./tests/n8n:/opt/tuc-n8n:ro

  wordpress:
    image: ${TUC_WP_IMAGE:-wordpress:php8.2-apache}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TUC_WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${TUC_DB_NAME:?Renseignez TUC_DB_NAME dans .env}
      WORDPRESS_DB_USER: ${TUC_DB_USER:?Renseignez TUC_DB_USER dans .env}
      WORDPRESS_DB_PASSWORD: ${TUC_DB_PASSWORD:?Renseignez TUC_DB_PASSWORD dans .env}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        @ini_set( 'display_errors', 0 );
    volumes:
      - tuc_wp_data:/var/www/html
      - ./wordpress/tuc-market-core:/var/www/html/wp-content/plugins/tuc-market-core:ro
      - ./wordpress/tuc-theme:/var/www/html/wp-content/themes/tuc-theme:ro

volumes:
  tuc_db_data:
  tuc_wp_data:
  tuc_n8n_data:
